<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Crystalline Rose Angel Codex</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0FC; --surface:#FFFFFF; --surface-2:#EEE6FA; --ink:#1E1270; --ink-soft:#5B4E8E; --line:rgba(30,18,112,.13);
  --orchid:#A94FC6; --orchid-deep:#8A36A8; --cyan:#1FD6DF; --cyan-ink:#0A8F97; --gold:#B8872A; --gold-soft:#E2BE5E; --plum:#4A1850;
  --portal:#120A3A; --portal-ink:#F1ECFF; --portal-soft:#B9AEE0;
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, serif; --sans:"Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif; --script:"Parisienne", "Snell Roundhand", "Apple Chancery", cursive;
  --r-lg:22px; --r-md:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0726; --surface:#170F3F; --surface-2:#211656; --ink:#F1ECFF; --ink-soft:#B9AEE0; --line:rgba(185,174,224,.17);
  --cyan-ink:#1FD6DF; --gold:#E2BE5E; --orchid-deep:#C57BE0;
}}
:root[data-theme="dark"]{
  --bg:#0C0726; --surface:#170F3F; --surface-2:#211656; --ink:#F1ECFF; --ink-soft:#B9AEE0; --line:rgba(185,174,224,.17);
  --cyan-ink:#1FD6DF; --gold:#E2BE5E; --orchid-deep:#C57BE0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;width:100%}
textarea{resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--orchid);box-shadow:0 0 0 3px rgba(169,79,198,.18)}
.script{font-family:var(--script);font-weight:400}

.app{min-height:100%}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-align:left}
.brand .script{display:block;font-size:22px;line-height:1;color:var(--orchid)}
.brand-sub{display:block;font-size:12px;letter-spacing:.04em;color:var(--cyan-ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;font-size:15px;color:var(--ink-soft)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface-2);color:var(--ink)}
.main{max-width:860px;margin:0 auto;padding:28px 20px 40px}
.foot{text-align:center;padding:24px 20px 36px;color:var(--ink-soft);font-size:14px}
.foot .script{font-size:22px;color:var(--orchid);margin-right:6px}
.join-link{display:inline-block;margin-top:14px;padding:11px 22px;border-radius:999px;border:1px solid var(--orchid);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;background:var(--surface)}
.join-link:hover{background:var(--surface-2)}
.hero-join{display:block;margin-top:10px;font-size:14px;color:var(--ink-soft);text-decoration:underline}

/* Portal: always a window into the cosmos, in either theme */
.portal{background:
  radial-gradient(60% 50% at 20% 20%,rgba(31,214,223,.18),transparent 70%),
  radial-gradient(55% 55% at 85% 30%,rgba(169,79,198,.28),transparent 70%),
  radial-gradient(70% 60% at 50% 110%,rgba(74,24,80,.9),transparent 70%),
  radial-gradient(1px 1px at 12% 30%,#fff8,transparent),radial-gradient(1px 1px at 72% 18%,#fff9,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#E2BE5Ecc,transparent),radial-gradient(1px 1px at 88% 76%,#fff8,transparent),radial-gradient(1px 1px at 58% 42%,#fff6,transparent),
  var(--portal);color:var(--portal-ink)}

.spiral{display:block}
.spin-slow .spiral-dots{transform-origin:160px 160px;animation:spin 90s linear infinite}
.spin-fast .spiral-dots{transform-origin:160px 160px;animation:spin 3.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:64px 24px 48px;text-align:center;isolation:isolate}
.hero-spiral{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);z-index:-2;opacity:.6;width:min(560px,130vw)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(42% 38% at 50% 48%,rgba(18,10,58,.78),rgba(18,10,58,0) 100%)}
.hero-spiral svg{width:100%;height:auto}
.house .script{font-size:30px;color:var(--gold-soft)}
.hero-title{font-family:var(--serif);font-weight:500;font-size:clamp(40px,8vw,74px);line-height:1;margin:6px 0 14px;letter-spacing:-.01em;text-shadow:0 2px 30px rgba(18,10,58,.9)}
.hero-title em{font-style:italic;font-weight:400;color:#DDFBFC}
.hero-sub{font-family:var(--serif);font-size:24px;font-style:italic;margin:0 0 26px;color:var(--portal-ink)}
.hero-fine{color:var(--portal-soft);font-size:14px;margin:14px 0 0}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.door{text-align:left;padding:20px 22px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);transition:border-color .2s}
.door:hover{border-color:var(--orchid)}
.door-h{display:block;font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2;margin-bottom:4px}
.door-p{display:block;font-size:15px;color:var(--ink-soft)}
.door.rose{background:linear-gradient(135deg,#FBEFF2,#F6E1EA);border-color:#EBC1CF;color:#6B2F4A}
.door.rose .door-p{color:#8E5670}
.name-chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 22px;border-radius:999px;font-weight:500;font-size:16px;transition:transform .15s,background .2s,opacity .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--orchid),#6A2FB0);color:#fff;box-shadow:0 6px 24px -8px rgba(169,79,198,.7)}
.btn.primary:disabled{opacity:.4;box-shadow:none}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--orchid)}
.btn.ghost:disabled{opacity:.6}
.btn.gold{background:var(--gold-soft);color:#2A1C00}
.btn.done-btn{background:var(--cyan);color:#062B2E}
.btn.lg{min-height:54px;padding:12px 34px;font-size:18px}
.btn.sm{min-height:38px;padding:6px 16px;font-size:15px}
.light-btn{background:transparent !important;border-color:rgba(255,255,255,.3) !important;color:#fff !important}
.link{color:var(--orchid-deep);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.link.danger{color:#C23A5B}
.link.back{margin-bottom:12px;display:inline-block}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.center-row{display:flex;justify-content:center;margin:20px 0}
.wrap{flex-wrap:wrap}

/* Chips & options */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--orchid)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--ah);box-shadow:0 0 8px var(--ah)}
.options,.needs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.opt{text-align:left;padding:16px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:16px;transition:border-color .2s}
.opt:hover{border-color:var(--orchid)}
.opt.on{border-color:var(--orchid);background:linear-gradient(135deg,rgba(169,79,198,.14),rgba(31,214,223,.1));box-shadow:inset 0 0 0 1px var(--orchid)}

/* Type */
.h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,50px);line-height:1.05;margin:4px 0 8px}
.h2{font-family:var(--serif);font-weight:500;font-size:clamp(26px,4.5vw,34px);line-height:1.15;margin:0 0 10px}
.h2.light{color:var(--portal-ink)}
.muted{color:var(--ink-soft)}
.small{font-size:15px}
.intro{max-width:60ch;margin:0 0 22px}
.fine{font-size:13.5px;color:var(--ink-soft);margin:14px 0 0}
.fine.center{text-align:center}
.fine.light,.light-muted{color:var(--portal-soft)}
.pre{font-family:var(--serif);font-style:italic;font-size:19px;margin:0;color:var(--portal-soft)}

/* Oracle */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 26px}
.steps li{flex:1;font-size:13.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:3px solid var(--line)}
.steps li span{font-family:var(--serif);font-size:20px;line-height:1}
.steps li.now{color:var(--ink);border-top-color:var(--orchid)}
.steps li.past{border-top-color:var(--cyan)}
.q textarea{margin:8px 0 14px}
.nav-row{margin-top:26px}
.forced{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;font-family:var(--serif);font-size:20px}
.crisis p{max-width:62ch}

/* Reveal */
.reveal{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden}
.reveal-spiral{transition:transform 1.6s ease,opacity 1.6s ease;width:min(360px,80vw)}
.reveal-spiral svg{width:100%;height:auto}
.reveal-spiral.settle{transform:scale(.5) translateY(-20px);opacity:.75}
.reveal-words{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;min-height:34px;margin-top:-10px}
.reveal-words span{font-family:var(--serif);font-style:italic;font-size:24px;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s;color:#DDFBFC}
.reveal-words span.in{opacity:1;transform:none}
.reveal-name h2{font-family:var(--serif);font-weight:500;font-size:clamp(40px,9vw,72px);line-height:1;margin:10px 0 8px;letter-spacing:.01em;animation:rise 1.6s ease both;text-shadow:0 0 40px rgba(31,214,223,.4)}
.reveal-name .btn{margin-top:26px}
.listening{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom,0px));color:var(--portal-soft);font-size:15px}
.weaving{color:var(--portal-soft);margin-top:24px}
.dots i{animation:blink 1.4s infinite both;font-style:normal}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* Reading */
.orb{display:inline-block;border-radius:50%;flex-shrink:0}
.r-head{border-radius:28px;padding:44px 24px 36px;text-align:center;margin-bottom:10px}
.r-head .orb{margin-bottom:8px}
.r-name{font-family:var(--serif);font-weight:500;font-size:clamp(38px,7vw,60px);line-height:1.02;margin:6px 0 6px}
.r-gifts{color:var(--cyan);font-size:15px;letter-spacing:.03em;margin:0 0 18px}
.chapel .r-gifts{color:#A4557A}
.r-perm{font-family:var(--serif);font-style:italic;font-size:clamp(21px,3.4vw,26px);line-height:1.35;max-width:32ch;margin:0 auto 16px}
.r-woven{font-size:13.5px;color:var(--portal-soft);max-width:48ch;margin:0 auto}
.sec{padding:30px 0;border-bottom:1px solid var(--line)}
.sec-h{font-family:var(--serif);font-weight:600;font-size:25px;margin:0 0 12px;line-height:1.2}
.sec-note{margin:-6px 0 14px;color:var(--ink-soft);font-size:15px}
.lead{font-family:var(--serif);font-size:22px;line-height:1.55;margin:0;max-width:62ch}
.lead.soft,.soft{color:var(--ink-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.two .sec p{margin:0}

.map-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.map-tile{text-align:left;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:84px;position:relative;overflow:hidden}
.map-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ah)}
.map-tile:hover,.map-tile.open{border-color:var(--ah)}
.map-tile.open{background:var(--surface-2)}
.map-k{font-size:12.5px;color:var(--ink-soft)}
.map-v{font-family:var(--serif);font-size:19px;line-height:1.15;font-weight:600}
.map-how{margin:12px 0 0;padding:14px 18px;border-radius:var(--r-md);background:var(--surface-2);font-size:15.5px;animation:rise .4s ease both}

.prayer{margin:0;padding:26px 24px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.6;text-align:center}

.ritual{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:8px}
.ritual button{display:flex;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);align-items:flex-start}
.ritual button:hover{border-color:var(--ah,var(--orchid))}
.r-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:18px;border:1px solid var(--ah,var(--orchid));color:var(--ink)}
.r-name{display:block}
.ritual .r-name{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);margin:0}
.r-text{display:block;font-size:16px}
.ritual li.done button{background:var(--surface-2)}
.ritual li.done .r-num{background:var(--ah,var(--orchid));color:#fff;border-color:transparent}
.ritual li.done .r-text{color:var(--ink-soft)}

.timer{display:flex;gap:22px;align-items:center;padding:20px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
.breath-wrap{position:relative;width:130px;height:130px;flex-shrink:0;display:grid;place-items:center}
.breath{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--ah,var(--cyan)) 45%,transparent 72%);opacity:.75;transition-property:transform;transition-timing-function:ease-in-out}
.breath-label{position:relative;font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink);text-shadow:0 0 12px var(--surface)}
.timer-side{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px;flex-wrap:wrap}
.seg button{padding:5px 12px;border-radius:999px;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:var(--surface-2);color:var(--ink)}
.timer-count{font-family:var(--serif);font-size:34px;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums}

.jq{display:block;margin:0 0 16px}
.jq span{display:block;font-family:var(--serif);font-size:20px;margin-bottom:6px;line-height:1.3}
.jlist{margin:0;padding-left:20px;font-family:var(--serif);font-size:20px}
.jlist li{margin-bottom:6px}

.earthly{margin:30px 0 0;padding:26px;border-radius:var(--r-lg);border:1.5px solid var(--gold-soft);background:linear-gradient(135deg,rgba(226,190,94,.14),transparent 60%);text-align:center}
.earthly.compact{margin:16px 0;padding:18px;text-align:left}
.e-k{font-family:var(--script);font-size:28px;color:var(--gold);margin:0;line-height:1.2}
.e-v{font-family:var(--serif);font-size:26px;line-height:1.3;margin:6px auto 16px;max-width:30ch;font-weight:500}
.earthly.compact .e-v{font-size:21px;margin:4px 0 0;max-width:none}
.seal{margin:18px 0 0;border-radius:var(--r-lg);padding:38px 28px;text-align:center}
.seal p{font-family:var(--serif);font-style:italic;font-size:clamp(22px,3.6vw,28px);line-height:1.4;max-width:34ch;margin:0 auto}
.return{padding:30px 0 10px}
.return-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink-soft)}
.check input{width:18px;height:18px;accent-color:var(--orchid)}
.disclaimer{font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line);margin-top:34px;padding-top:16px;max-width:70ch}

/* Share */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,4,28,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.share-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.share-card{width:min(360px,86vw);aspect-ratio:4/5;border-radius:26px;padding:26px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;color:#F1ECFF;
  background:radial-gradient(70% 50% at 50% 28%,color-mix(in srgb,var(--ah) 40%,transparent),transparent 70%),radial-gradient(60% 50% at 80% 90%,rgba(169,79,198,.45),transparent 70%),#120A3A;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);border:1px solid rgba(226,190,94,.4)}
.share-spiral{position:absolute;top:18px;left:50%;transform:translateX(-50%);opacity:.95}
.share-pre{font-family:var(--serif);font-style:italic;color:#B9AEE0;margin:0}
.share-name{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.05;margin:4px 0}
.share-gifts{font-size:12.5px;color:var(--cyan);margin:0 0 12px}
.share-line{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.35;margin:0 0 16px}
.share-brand{font-size:11.5px;color:#B9AEE0;margin:0;line-height:1.3}
.share-brand .script{font-size:22px;color:var(--gold-soft)}

/* Library */
.wheel{border-radius:28px;padding:22px 16px 14px;margin-bottom:22px}
.wheel-stage{position:relative;width:min(460px,100%);margin:0 auto;aspect-ratio:1}
.wheel-svg{width:100%;height:100%;display:block}
.w-node{cursor:pointer;outline:none}
.w-node:focus-visible circle{stroke:#fff;stroke-width:2}
.w-init{font-family:var(--serif);font-size:11px;fill:#120A3A;font-weight:600;pointer-events:none}
.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel-center h3{font-family:var(--serif);font-weight:500;font-size:clamp(24px,5vw,32px);margin:4px 0 0;line-height:1}
.w-gifts{font-size:12px;color:var(--cyan);margin:2px 0}
.w-meta{font-size:12px;color:var(--portal-soft);margin:0}
.w-msg{font-family:var(--serif);font-style:italic;font-size:clamp(14px,2.6vw,17px);line-height:1.3;margin:6px 0 10px}
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.f-row{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:start}
.f-k{font-family:var(--serif);font-size:18px;padding-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{position:relative;overflow:hidden;text-align:left;padding:20px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.card:hover{border-color:var(--ah)}
.card-glow{position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:var(--ah);opacity:.16;filter:blur(30px)}
.card-top{display:flex;justify-content:space-between;align-items:center}
.card-energy{font-size:12.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.card-name{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.1;margin-top:6px}
.card-gifts{font-size:13px;color:var(--cyan-ink);margin:0}
.card-msg{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35;flex:1}
.card-meta{font-size:13px;color:var(--ink-soft)}
.card-cta{font-size:14.5px;color:var(--orchid-deep);font-weight:500;margin-top:4px}
.empty{text-align:center;padding:30px 20px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--ink-soft)}
.empty.big{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 20px}
.empty.big p{max-width:44ch;margin:0}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.cmp-col{padding:20px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);border-top:3px solid var(--ah)}
.cmp-col select{margin-bottom:14px}
.cmp-col h3{font-family:var(--serif);font-size:26px;font-weight:600;margin:8px 0 2px}
.cmp-col p{font-size:15.5px}
.combo{font-family:var(--serif);font-style:italic;font-size:clamp(26px,4.4vw,34px);line-height:1.2;margin:0 0 8px}

/* Daily */
.daily-card{margin-top:18px;padding:22px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);border-top:3px solid var(--ah);color:var(--ink);text-align:left}
.dc-head{display:flex;gap:14px;align-items:center}
.dc-head h3{font-family:var(--serif);font-size:28px;font-weight:600;margin:0;line-height:1.1}
.dc-msg{font-family:var(--serif);font-style:italic;font-size:22px;margin:14px 0}
.small-h{font-size:20px}
.deck-sec{border-radius:28px;padding:30px 20px;margin-top:30px;text-align:center;border-bottom:0}
.deck{display:flex;justify-content:center;padding:34px 0 20px;min-height:230px}
.deck-card{width:118px;height:172px;margin:0 -18px;border-radius:14px;background:linear-gradient(160deg,#2A1A7A,#120A3A);border:1px solid rgba(226,190,94,.55);box-shadow:0 12px 30px -10px rgba(0,0,0,.7);transform:rotate(calc(var(--i) * 7deg)) translateY(calc(var(--i) * var(--i) * 4px));transition:transform .35s,opacity .4s;display:grid;place-items:center}
.deck-card:hover,.deck-card:focus-visible{transform:rotate(calc(var(--i) * 7deg)) translateY(-16px)}
.deck-card.flip{transform:translateY(-30px) rotateY(180deg) scale(1.1);transition:transform .7s}
.deck-card.fade{opacity:.15}
.drawn{display:flex;flex-direction:column;align-items:center;gap:14px}
.drawn .daily-card{width:100%}

/* Chapel: warm rose and pearl */
.app.in-chapel{--cbg:#FBF3EF}

.rose-btn{background:linear-gradient(135deg,#D87497,#A4466B);color:#fff}

.mary-msg p{font-family:var(--serif);font-size:21px;line-height:1.55;margin:0 0 12px}
.mary-msg .surrender{font-style:italic;color:var(--orchid-deep)}
.rose-e{border-color:#E9A3B8;background:linear-gradient(135deg,rgba(233,163,184,.2),transparent 60%)}
.rose-e .e-k{color:#B97A2E}
.chapel-seal{font-family:var(--serif);font-style:italic;font-size:24px;text-align:center;margin:30px auto 0;max-width:30ch}
.chapel .disclaimer{color:var(--ink-soft)}
.chapel .timer,.chapel .ritual button,.chapel .prayer{background:#FFFBF8}

/* Path */
.timeline{list-style:none;padding:0 0 0 22px;margin:0;border-left:1px dashed var(--line)}
.timeline li{position:relative;margin-bottom:12px}
.tl-dot{position:absolute;left:-30px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--ah);box-shadow:0 0 12px var(--ah)}
.tl-head{display:flex;flex-direction:column;text-align:left;width:100%;padding:14px 18px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.tl-head:hover{border-color:var(--ah)}
.tl-date{font-size:13px;color:var(--ink-soft)}
.tl-name{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.2}
.tl-ex{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-soft)}
.tl-body{padding:16px 18px;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-md) var(--r-md);margin-top:-6px;background:var(--surface)}
.tl-j p{font-size:15.5px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:15px;animation:rise .3s ease both}

@media (max-width:720px){
  .main{padding:18px 14px 30px}

  .seg{justify-content:center}

async function weaveTransmission(angel, inputs) {
  const sample = await getSample();

  const prompt = `You are writing one personalised angelic transmission inside "${BRAND.title}", a spiritual reflection and self-guided practice tool.

"journal": array of 3 questions.
"action": one concrete, small earthly action for today.
"seal": 1 to 2 sentence closing blessing.`;
  const ctrl = new AbortController();

    if (!j || !j.recognition || !j.practice || !Array.isArray(j.practice.steps) || j.practice.steps.length < 3) return null;
    return {
      permission: clean(j.permission) || angel.perm,
      recognition: clean(j.recognition),
      invitation: clean(j.invitation) || angel.invite,
      prayer: clean(j.prayer) || angel.prayer,
      practice: { title: clean(j.practice.title) || `${firstName(angel)} practice`, minutes: Math.min(21, Math.max(2, parseInt(j.practice.minutes, 10) || angel.mins)), steps: j.practice.steps.slice(0, 6).map(clean) },

function fallbackTransmission(angel, inputs) {

  else if (inputs.chips.length) rec += `You named this: “${inputs.chips[0]}.” That is honest, and honesty is where support can reach you. `;
  if (aL) rec += `Right now your attention is being drawn toward ${aL.toLowerCase()}`;
  if (sL) rec += `${aL ? ", and" : "Part of you"} ${aL ? "part of you " : ""}is longing to feel ${sL.toLowerCase()}`;
  if (aL || sL) rec += ". ";
  rec += `${firstName(angel)} holds exactly this territory: ${angel.gifts.map(g => g.toLowerCase()).join(", ")}. Call on this presence when ${angel.call}`;
  return {
    permission: angel.perm, recognition: rec, invitation: angel.invite, prayer: angel.prayer,
    practice: { title: `${firstName(angel)} practice`, minutes: angel.mins, steps: angel.ritual },
    journal: [...angel.journal, sL ? `What would feeling ${sL.toLowerCase()} change about the next 24 hours?` : "What would change in the next 24 hours if I trusted this message?"],

  };
}

function chooseAngel(inputs) {
  const text = (inputs.text || "").toLowerCase();
  const chipDefs = CHIPS.filter(c => inputs.chips.includes(c.t));
  let best = null, bestScore = -1;
  ANGELS.forEach(a => {
    let s = Math.random() * 0.9;
    if (inputs.area && a.areas.includes(inputs.area)) s += 4 - a.areas.indexOf(inputs.area) * 0.4;
    if (inputs.shift && a.shifts.includes(inputs.shift)) s += 4 - a.shifts.indexOf(inputs.shift) * 0.4;
    chipDefs.forEach(c => { c.a.forEach(x => { if (a.areas.includes(x)) s += 1.2; }); c.s.forEach(x => { if (a.shifts.includes(x)) s += 1.2; }); });
    a.keys.forEach(k => { if (text.includes(k)) s += 1.6; });
    if (s > bestScore) { bestScore = s; best = a; }
  });
  return best;
}

/* ---------- Visual motif: the dotted sacred spiral ---------- */
let spiralCount = 0;
function Spiral({ size = 320, spin = "slow", tint }) {
  const uid = useMemo(() => "sp" + (++spiralCount), []);
  const dots = useMemo(() => {
    const out = [], c = 160, arms = 46, rings = 14;
    for (let i = 0; i < arms; i++) for (let j = 0; j < rings; j++) {
      const t = j / (rings - 1), r = c * (0.1 + 0.8 * t), a = i * 2 * Math.PI / arms + t * 1.25;
      const gold = j === rings - 1;
      out.push({ x: c + r * Math.cos(a), y: c + r * Math.sin(a), r: gold ? 3.4 : 0.7 + t * 2.3, fill: gold ? "#E2BE5E" : t < 0.28 ? "#BE8CFF" : (j % 2 ? "#1FD6DF" : "#0E8F97"), o: gold ? 1 : 0.3 + 0.7 * t });
    }
    return out;
  }, []);
  return (
    <svg className={"spiral spin-" + spin} width={size} height={size} viewBox="0 0 320 320" aria-hidden="true">
      <defs>
        <radialGradient id={uid + "h"}><stop offset="0" stopColor={tint || "#1FD6DF"} stopOpacity=".42" /><stop offset=".55" stopColor="#A94FC6" stopOpacity=".16" /><stop offset="1" stopColor="#A94FC6" stopOpacity="0" /></radialGradient>
        <radialGradient id={uid + "c"}><stop offset="0" stopColor="#fff" /><stop offset=".3" stopColor="#E6D6FF" stopOpacity=".9" /><stop offset="1" stopColor="#8E5BE8" stopOpacity="0" /></radialGradient>
      </defs>
      <circle cx="160" cy="160" r="158" fill={`url(#${uid}h)`} />
      <g className="spiral-dots">{dots.map((d, k) => <circle key={k} cx={d.x} cy={d.y} r={d.r} fill={d.fill} opacity={d.o} />)}</g>
      <circle cx="160" cy="160" r="34" fill={`url(#${uid}c)`} />
    </svg>
  );
}

function Timer({ minutes = 5 }) {
  const opts = [2, 5, 10, 21];
  const near = opts.reduce((p, c) => Math.abs(c - minutes) < Math.abs(p - minutes) ? c : p, 5);
  const [mins, setMins] = useState(near);
  const [left, setLeft] = useState(near * 60);
  const [run, setRun] = useState(false);
  useEffect(() => { setLeft(mins * 60); setRun(false); }, [mins]);
  useEffect(() => {
    if (!run) return;
    const iv = setInterval(() => setLeft(l => { if (l <= 1) { setRun(false); return 0; } return l - 1; }), 1000);
    return () => clearInterval(iv);
  }, [run]);
  const elapsed = mins * 60 - left, ph = elapsed % 10, inhale = ph < 4;
  const done = left === 0;
  const mm = String(Math.floor(left / 60)).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
  return (
    <div className="timer">
      <div className="breath-wrap">
        <div className="breath" style={{ transform: `scale(${run ? (inhale ? 1 : .6) : .74})`, transitionDuration: run ? (inhale ? "4s" : "6s") : ".6s" }} />
        <div className="breath-label">{done ? "Complete" : run ? (inhale ? "Breathe in" : "Breathe out") : `${mm}:${ss}`}</div>
      </div>
      <div className="timer-side">
        <div className="seg" role="group" aria-label="Practice length">
          {opts.map(o => <button key={o} className={o === mins ? "on" : ""} onClick={() => setMins(o)}>{o} min</button>)}

        <div className="timer-count" aria-live="polite">{mm}:{ss}</div>
        <div className="row">
          <button className="btn primary sm" onClick={() => done ? (setLeft(mins * 60), setRun(true)) : setRun(!run)}>{run ? "Pause" : done ? "Begin again" : elapsed > 0 ? "Resume" : "Begin practice"}</button>
          {elapsed > 0 && !run && !done && <button className="btn ghost sm" onClick={() => setLeft(mins * 60)}>Reset</button>}
        </div>
        <p className="fine">In for four, out for six. Silent audio, safe for anywhere.</p>
      </div>
    </div>
  );
}

function AngelWheel({ openAngel }) {
  const [sel, setSel] = useState("michael");
  const a = byId(sel);
  const R = 150, C = 180;
  return (
    <div className="wheel portal">
      <div className="wheel-stage">
        <svg viewBox="0 0 360 360" className="wheel-svg" role="group" aria-label="Angel wheel">
          <circle cx={C} cy={C} r={R} fill="none" stroke="rgba(226,190,94,.35)" strokeDasharray="1 5" />
          <circle cx={C} cy={C} r={R - 34} fill="none" stroke="rgba(31,214,223,.15)" />
          {ANGELS.map((x, i) => {
            const ang = -Math.PI / 2 + i * 2 * Math.PI / ANGELS.length;
            const px = C + R * Math.cos(ang), py = C + R * Math.sin(ang), on = x.id === sel;
            return (
              <g key={x.id} className="w-node" tabIndex={0} role="button" aria-label={x.name} aria-pressed={on}
                onClick={() => setSel(x.id)} onMouseEnter={() => setSel(x.id)} onFocus={() => setSel(x.id)}
                onKeyDown={e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), openAngel(x.id))}>
                {on && <line x1={C} y1={C} x2={px} y2={py} stroke={x.hex} strokeOpacity=".5" />}
                <circle cx={px} cy={py} r={on ? 15 : 9} fill={x.hex} opacity={on ? 1 : .8} style={{ filter: on ? `drop-shadow(0 0 10px ${x.hex})` : "none" }} />
                <text x={px} y={py + (on ? 4 : 3)} textAnchor="middle" className="w-init">{x.name.replace("Archangel ", "")[0]}</text>
              </g>
            );
          })}
        </svg>
        <div className="wheel-center" style={{ "--ah": a.hex }}>
          <Orb hex={a.hex} size={40} />
          <h3>{a.name.replace("Archangel ", "")}</h3>
          <p className="w-gifts">{a.gifts.join(" ✧ ")}</p>
          <p className="w-meta">{a.chakra}</p>
          <p className="w-msg">“{a.msg}”</p>
          <button className="btn primary sm" onClick={() => openAngel(a.id)}>Meet {a.name.replace("Archangel ", "")}</button>
        </div>
      </div>
      <p className="fine center light">Hover or tap around the wheel. Each light is an angel.</p>
    </div>
  );
}

async function weaveMary(text) {
  const sample = await getSample();
  if (!sample) return null;
  const prompt = `You are writing a short message from Mary, Queen of Angels, inside "${BRAND.title}", a spiritual reflection tool. Her voice is maternal, compassionate, gentle, and unhurried. She softens shame, releases the need to solve everything, and offers unconditional love.

What the person wants to lay down: """${text}"""

${SAFETY}

Return ONLY JSON: {"message": 4 to 6 sentences addressed to them as "beloved", reflecting what they shared, "surrender": one first-person line beginning "I lay down"}`;
  try {
    const j = await sample.json(prompt, { modelTier: "default" });
    if (!j || !j.message) return null;
    return { message: clean(j.message), surrender: clean(j.surrender) || "I lay down what was never mine to carry alone." };
  } catch (e) { return null; }
}

                  {e.inputs && e.inputs.text && <p className="muted small">You shared: “{e.inputs.text}”</p>}
                  {e.t && <><p>{e.t.recognition}</p><p className="soft">{e.t.invitation}</p><p><strong>One thing:</strong> {e.t.action} {e.actionDone ? "(done)" : ""}</p></>}
                  {e.mary && <p>{e.mary.message}</p>}
                  {e.t && e.answers && e.answers.some(Boolean) && <div className="tl-j">{e.t.journal.map((q, i) => e.answers[i] ? <p key={i}><em>{q}</em><br />{e.answers[i]}</p> : null)}</div>}
                  <label className="jq"><span>What changed since you received this?</span>
                    <textarea rows={3} defaultValue={e.changed || ""} onBlur={ev => update(e.id, { changed: ev.target.value })} />
                  </label>
                  <div className="row wrap">
                    {e.angelId !== "mary" && <button className="btn ghost sm" onClick={() => openAngel(e.angelId)}>Revisit {firstName(a)}</button>}
                    <button className="link danger" onClick={() => remove(e.id)}>Delete this entry</button>
                  </div>
                </div>
              )}
            </li>
          );
        })}
      </ol>
      <div className="row center-row">
        {!confirm ? <button className="link danger" onClick={() => setConfirm(true)}>Delete my whole path</button>
          : <span className="row">This removes every saved entry from this device. <button className="btn ghost sm" onClick={() => { setList([]); setConfirm(false); }}>Delete everything</button><button className="link" onClick={() => setConfirm(false)}>Keep my path</button></span>}
      </div>
    </div>
  );
}

/* ---------- App shell ---------- */
function App() {
  const [view, setView] = useState("home");
  const [angelId, setAngelId] = useState(null);
  const [forced, setForced] = useState(null);
  const [reveal, setReveal] = useState(null);
  const [reading, setReading] = useState(null);
  const [savedIds, setSavedIds] = useState([]);
  const [dailyPreset, setDailyPreset] = useState(null);
  const [compareFirst, setCompareFirst] = useState(null);
  const [path, setPathState] = useState(loadPath);
  const [toast, setToast] = useState("");
  const setPath = list => { setPathState(list); if (!savePath(list)) flash("Saving is unavailable in this browser, so entries last until you close the page."); };
  const flash = m => { setToast(m); setTimeout(() => setToast(""), 3200); };
  const go = v => { setView(v); if (v !== "daily") setDailyPreset(null); window.scrollTo(0, 0); };
  const openAngel = id => { setAngelId(id); setView("angel"); window.scrollTo(0, 0); };
  const openDaily = id => { setDailyPreset(id); setView("daily"); window.scrollTo(0, 0); };
  const callIn = id => { setForced(id); go("oracle"); };

  const startReveal = async (inputs, redirect) => {
    if (redirect === "chapel") return go("chapel");
    const angel = forced ? byId(forced) : chooseAngel(inputs);
    const id = "r" + Date.now();
    setReveal({ angel, ready: false });
    getSample();
    const woven = await weaveTransmission(angel, inputs);
    const t = woven || fallbackTransmission(angel, inputs);
    setReading({ id, date: new Date().toISOString(), kind: "Transmission", angelId: angel.id, inputs, t });
    setReveal(r => r ? { ...r, ready: true } : r);
  };
  const finishReveal = () => { setReveal(null); setForced(null); setView("reading"); window.scrollTo(0, 0); };

  const saveReading = ({ answers, actionDone, includeWords }) => {
    const entry = { ...reading, answers, actionDone, inputs: includeWords ? reading.inputs : null };
    setPath([entry, ...path.filter(e => e.id !== entry.id)]);
    setSavedIds(s => [...s, reading.id]);
    flash("Saved to My path");
  };
  const saveDaily = (aid, kind) => { setPath([{ id: "d" + Date.now(), date: new Date().toISOString(), kind, angelId: aid }, ...path]); flash("Saved to My path"); };
  const saveChapel = m => { setPath([{ id: "m" + Date.now(), date: new Date().toISOString(), kind: "Rose Chapel", angelId: "mary", mary: m }, ...path]); flash("Saved to My path"); };

  const tabs = [["home", "Home"], ["oracle", "Receive"], ["library", "Library"], ["daily", "Daily"], ["chapel", "Rose Chapel"], ["path", "My path"]];
  const activeTab = view === "angel" || view === "compare" ? "library" : view === "reading" ? "oracle" : view;
  return (
    <div className={"app" + (view === "chapel" ? " in-chapel" : "")}>
      <nav className="nav">
        <button className="brand" onClick={() => go("home")} aria-label="Codex home">
          <Spiral size={30} spin="slow" /><span><span className="script">{BRAND.house}</span><span className="brand-sub">{BRAND.short}</span></span>
        </button>
        <div className="tabs" role="tablist">
          {tabs.map(([k, l]) => <button key={k} role="tab" aria-selected={activeTab === k} className={activeTab === k ? "on" : ""} onClick={() => { if (k === "oracle" && reading && view !== "oracle") { go("reading"); return; } go(k); }}>{k === "oracle" && reading ? "My reading" : l}</button>)}
        </div>
      </nav>
      <main className="main">
        {view === "home" && <Home go={go} openAngel={openAngel} />}
        {view === "oracle" && <Oracle forced={forced} clearForced={() => setForced(null)} onReveal={startReveal} />}
        {view === "reading" && reading && <Reading key={reading.id} reading={reading} saved={savedIds.includes(reading.id)} onSave={saveReading} go={go} openAngel={openAngel} openDaily={openDaily} />}
        {view === "reading" && reading && <div className="center-row"><button className="link" onClick={() => { setReading(null); go("oracle"); }}>Clear this reading and begin a new one</button></div>}
        {view === "library" && <Library openAngel={openAngel} go={go} />}
        {view === "angel" && angelId && <AngelPage id={angelId} go={go} callIn={callIn} openCompare={id => { setCompareFirst(id); go("compare"); }} />}
        {view === "compare" && <Compare first={compareFirst} openAngel={openAngel} />}
        {view === "daily" && <Daily key={dailyPreset || "daily"} preset={dailyPreset} openAngel={openAngel} onSaveDaily={saveDaily} />}
        {view === "chapel" && <Chapel onSaveChapel={saveChapel} />}
        {view === "path" && <MyPath list={path} setList={setPath} go={go} openAngel={openAngel} />}
      </main>
      <footer className="foot"><span className="script">{BRAND.house}</span> <span>{BRAND.tagline}</span><br /><a className="join-link" href="https://www.skool.com/the-crystalline-rose-temple-8195" target="_blank" rel="noopener noreferrer">Join the Temple</a></footer>
      {reveal && <Reveal angel={reveal.angel} ready={reveal.ready} onDone={finishReveal} />}
      {toast && <div className="toast" role="status">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
